spring.application.name=signaturestudio

# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration (Oracle)
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:ORCL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
# Oracle JDBC timezone properties for UTC handling
spring.datasource.hikari.data-source-properties.oracle.jdbc.timezoneAsRegion=false

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
spring.jpa.properties.hibernate.format_sql=true
# Ensure Hibernate uses JDBC 4.2 timezone handling (supports Instant)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Spring Session Configuration (Oracle)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.table-name=SPRING_SESSION
spring.session.timeout=30m

# Service URLs
esignature.service.url=${ESIGNATURE_SERVICE_URL:http://localhost:8081}
alert.service.url=${ALERT_SERVICE_URL:http://localhost:8082}
branding.service.url=${BRANDING_SERVICE_URL:http://localhost:8083}

# Document Upload Configuration
document.upload.dir=${DOCUMENT_UPLOAD_DIR:./uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging Configuration
logging.level.com.wellsfargo.signaturestudio=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.session=DEBUG

# Hibernate Converter Logging (shows Instant → LocalDateTime conversions)
logging.level.org.hibernate.type.descriptor.converter=DEBUG

# Security Audit Logging
logging.level.SECURITY_AUDIT=INFO

# Logging Pattern - Include stack traces for exceptions
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n%ex{full}
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n%ex{full}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:signaturestudio-bff-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=transactionEvent:com.wellsfargo.signaturestudio.dto.TransactionEventDTO

# Kafka Topics
kafka.topic.esignature.events=${KAFKA_TOPIC_ESIGNATURE_EVENTS:esignature-transaction-events}

# LDAP/Active Directory Configuration
ldap.url=${LDAP_URL:ldap://localhost:389}
ldap.base=${LDAP_BASE:dc=example,dc=com}
ldap.username=${LDAP_USERNAME:}
ldap.password=${LDAP_PASSWORD:}
ldap.user.search.base=${LDAP_USER_SEARCH_BASE:}
ldap.user.search.filter=${LDAP_USER_SEARCH_FILTER:(&(objectClass=user)(|(sAMAccountName={0})(mail={0})(displayName=*{0}*)(cn=*{0}*)))}
